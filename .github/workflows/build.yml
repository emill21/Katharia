name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk Katharia.apk
          echo "VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Katharia ${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            **Install:** download **Katharia.apk** below and open it on your phone.
            First launch: turn on Katharia in Accessibility (on Android 13+, App info → ⋮ → Allow restricted settings first).
          files: Katharia.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: Katharia-apk
          path: Katharia.apk
